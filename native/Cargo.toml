[package]
name = "rustrender_core"
version = "0.1.0"
edition = "2021"
description = "Native visibility/culling core for the RustRender Fabric mod"
license = "MIT"

[lib]
name = "rustrender_core"
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# Panics must unwind so the JNI boundary can convert them into a Java
# exception instead of aborting the whole game process.
panic = "unwind"
